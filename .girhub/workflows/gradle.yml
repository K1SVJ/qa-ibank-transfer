name: Gradle CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Start SUT
        run: nohup java -jar ./artifacts/app-ibank-build-for-testers.jar > app.log 2>&1 &

      - name: Wait for SUT
        run: sleep 15

      - name: Run tests
        run: chmod +x gradlew && ./gradlew test -Dselenide.headless=true